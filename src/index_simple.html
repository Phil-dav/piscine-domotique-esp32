<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piscine — Température</title>
  <link rel="icon" type="image/png" href="/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      background-color: #0b1120;
      color: #c8d8e8;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    /* ── Enveloppe générale ──────────────────────────────────── */
    .app-wrapper {
      max-width: 720px;
      margin: 16px auto;
      padding: 0 16px 24px;
    }

    .app-frame {
      background: #0d1a2e;
      border: 1px solid #1e3a5f;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 2px 32px rgba(0, 150, 255, 0.07);
    }

    /* ── En-tête (barre au-dessus du cadre) ─────────────────── */
    .header-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 12px 4px 16px;
    }

    .header-title-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      text-align: center;
    }

    .header-brand {
      font-family: 'Orbitron', monospace;
      font-size: 0.6rem;
      letter-spacing: 4px;
      color: #2a5080;
      text-transform: uppercase;
    }

    .header-title {
      font-family: 'Orbitron', monospace;
      font-size: 1.2rem;
      font-weight: 700;
      color: #e2e8f0;
      letter-spacing: 1px;
    }

    .header-badges-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .header-clock {
      text-align: center;
      min-width: 160px;
      padding: 6px 18px;
      border: 1px solid #1a3050;
      border-radius: 8px;
      background: rgba(255,255,255,0.03);
    }

    .date {
      font-size: 0.7rem;
      color: #4a6888;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }

    .time {
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.7rem;
      color: #00d4ff;
      letter-spacing: 1px;
    }

    .time-source {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 1px;
      padding: 2px 7px;
      border-radius: 4px;
      display: inline-block;
      margin-top: 2px;
    }
    .time-source-gps  { background: #064e3b; color: #10b981; }
    .time-source-ntp  { background: #0c2a4a; color: #38bdf8; }
    .time-source-none { background: #4a1010; color: #ef4444; }

    .blink {
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    /* ── Vignette GPS ────────────────────────────────────────── */
    .gps-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border: 1px solid #1a3050;
      border-radius: 8px;
      background: rgba(255,255,255,0.03);
      transition: border-color 0.4s, box-shadow 0.4s;
    }
    .gps-badge.gps-ok   { border-color: #10b981; box-shadow: 0 0 10px rgba(16,185,129,0.2); }
    .gps-badge.gps-weak { border-color: #f59e0b; box-shadow: 0 0 10px rgba(245,158,11,0.2); }
    .gps-badge.gps-none { border-color: #ef4444; box-shadow: 0 0 10px rgba(239,68,68,0.15); }
    .gps-sat-icon { width: 22px; height: 22px; flex-shrink: 0; }
    .gps-info { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; }
    .gps-label {
      font-size: 0.55rem; color: #4a6888;
      text-transform: uppercase; letter-spacing: 1.5px; font-family: Arial, sans-serif;
    }
    .gps-value {
      font-family: 'Orbitron', monospace; font-size: 0.82rem;
      font-weight: 700; color: #4a6888; transition: color 0.4s;
    }
    /* ── Vignette Position ───────────────────────────────────── */
    .position-badge {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 12px;
      border: 1px solid #1a3050; border-radius: 8px;
      background: rgba(255,255,255,0.03);
      text-decoration: none; cursor: pointer;
      transition: border-color 0.4s, box-shadow 0.4s;
    }
    .position-badge.position-ok {
      border-color: #38bdf8; box-shadow: 0 0 10px rgba(56,189,248,0.2);
    }
    .position-icon { width: 22px; height: 22px; flex-shrink: 0; color: #38bdf8; }
    .position-info { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; }
    .position-label {
      font-size: 0.55rem; color: #4a6888;
      text-transform: uppercase; letter-spacing: 1.5px; font-family: Arial, sans-serif;
    }
    .position-value {
      font-family: 'Orbitron', monospace; font-size: 0.75rem;
      font-weight: 700; color: #38bdf8;
    }
    .position-badge:hover .position-value { text-decoration: underline; }

    /* ── Vignette WiFi ────────────────────────────────────────── */
    .wifi-badge {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 12px;
      border: 1px solid #1a3050; border-radius: 8px;
      background: rgba(255,255,255,0.03);
      transition: border-color 0.4s, box-shadow 0.4s;
    }
    .wifi-badge.wifi-ok   { border-color: #10b981; box-shadow: 0 0 10px rgba(16,185,129,0.2); }
    .wifi-badge.wifi-weak { border-color: #f59e0b; box-shadow: 0 0 10px rgba(245,158,11,0.2); }
    .wifi-badge.wifi-none { border-color: #ef4444; box-shadow: 0 0 10px rgba(239,68,68,0.15); }
    .wifi-icon  { width: 22px; height: 22px; flex-shrink: 0; }
    .wifi-info  { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; }
    .wifi-label {
      font-size: 0.55rem; color: #4a6888;
      text-transform: uppercase; letter-spacing: 1.5px; font-family: Arial, sans-serif;
    }
    .wifi-value {
      font-family: 'Orbitron', monospace; font-size: 0.82rem;
      font-weight: 700; color: #4a6888; transition: color 0.4s;
    }

    /* ── Ligne horloge + lien Adafruit IO ────────────────────── */
    .header-clock-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .adafruit-badge {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 12px;
      border: 1px solid #1a3050; border-radius: 8px;
      background: rgba(255,255,255,0.03);
      text-decoration: none; cursor: pointer;
      transition: border-color 0.4s, box-shadow 0.4s;
    }
    .adafruit-badge:hover {
      border-color: #38bdf8; box-shadow: 0 0 10px rgba(56,189,248,0.2);
    }
    .adafruit-icon { width: 20px; height: 20px; flex-shrink: 0; color: #38bdf8; }
    .adafruit-info { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; }
    .adafruit-label {
      font-size: 0.55rem; color: #4a6888;
      text-transform: uppercase; letter-spacing: 1.5px; font-family: Arial, sans-serif;
    }
    .adafruit-sub {
      font-family: 'Orbitron', monospace; font-size: 0.75rem;
      font-weight: 700; color: #38bdf8;
    }

    /* ── Rangée de cartes capteurs ───────────────────────────── */
    .cards-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .card {
      background: #0f1824;
      border: 1px solid #1a3050;
      border-radius: 10px;
      padding: 16px 18px;
    }

    .card-label {
      display: block;
      font-size: 0.62rem;
      color: #4a6888;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 10px;
    }

    .card-value {
      font-family: 'Orbitron', monospace;
      font-size: 1.7rem;
      font-weight: 700;
      color: #e2e8f0;
      line-height: 1;
    }

    .card-unit {
      font-family: 'Orbitron', monospace;
      font-size: 0.85rem;
      color: #4a6888;
      margin-left: 2px;
    }

    .card-water .card-value {
      color: #00d4ff;
    }

    .card-water .card-unit {
      color: #0099bb;
    }

    /* ── Responsive mobile portrait ─────────────────────────── */
    @media (max-width: 640px) {

      .app-wrapper {
        margin: 8px auto;
        padding: 0 8px 16px;
      }

      .app-frame {
        padding: 12px;
        border-radius: 10px;
      }

      .header-bar {
        gap: 10px;
        padding: 8px 4px 10px;
      }

      .header-clock {
        min-width: unset;
      }

      .cards-row {
        grid-template-columns: 1fr;
      }

      .header-title {
        font-size: 1rem;
      }

      .card-value {
        font-size: 1.4rem;
      }
    }
  </style>
</head>

<body>

  <div class="app-wrapper">

    <!-- En-tête — juste au-dessus du cadre -->
    <div class="header-bar">
      <div class="header-title-row">
        <span class="header-brand">Domotique ESP32</span>
        <h1 class="header-title">Piscine — Température</h1>
      </div>

      <div class="header-badges-row">
        <!-- Vignette GPS -->
        <div class="gps-badge gps-none" id="gpsBadge">
          <svg class="gps-sat-icon" viewBox="0 0 24 24" fill="currentColor">
            <rect x="10.5" y="7" width="3" height="10" rx="1"/>
            <rect x="2"    y="10.5" width="7" height="3" rx="1" opacity="0.75"/>
            <rect x="15"   y="10.5" width="7" height="3" rx="1" opacity="0.75"/>
            <line x1="12" y1="7" x2="12" y2="3.5" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="12" cy="2.5" r="1.5"/>
          </svg>
          <div class="gps-info">
            <span class="gps-label">Satellite GPS</span>
            <span class="gps-value" id="gpsValue">Recherche…</span>
          </div>
        </div>

        <!-- Vignette Position -->
        <a class="position-badge position-none" id="positionBadge" href="#" target="_blank" rel="noopener" style="display:none;">
          <svg class="position-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/>
          </svg>
          <div class="position-info">
            <span class="position-label">Position</span>
            <span class="position-value" id="positionValue"></span>
          </div>
        </a>

        <!-- Vignette WiFi -->
        <div class="wifi-badge wifi-none" id="wifiBadge">
          <svg class="wifi-icon" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-linecap="round">
            <circle cx="12" cy="20.5" r="1.5" fill="currentColor" stroke="none"/>
            <path d="M9.17 17.67 A4 4 0 0 1 14.83 17.67"  stroke-width="1.8"/>
            <path d="M6.34 14.84 A8 8 0 0 1 17.66 14.84"  stroke-width="1.8"/>
            <path d="M3.51 12.01 A12 12 0 0 1 20.49 12.01" stroke-width="1.8"/>
          </svg>
          <div class="wifi-info">
            <span class="wifi-label">WiFi</span>
            <span class="wifi-value" id="wifiValue">Hors ligne</span>
          </div>
        </div>
      </div>

      <div class="header-clock-row">
        <div class="header-clock">
          <div class="date"></div>
          <div class="time"></div>
          <div class="time-source time-source-none" id="timeSource">⚠ FALLBACK</div>
        </div>

        <a class="adafruit-badge" href="https://io.adafruit.com/Domophil/dashboards/filtration-piscine"
           target="_blank" rel="noopener" title="Ouvrir les graphiques cloud Adafruit IO">
          <svg class="adafruit-icon" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8">
            <path d="M4 17a4 4 0 0 1 1.2-7.9 5.5 5.5 0 0 1 10.6-1.6A4.5 4.5 0 0 1 19.5 17H4z"/>
            <path d="M9 21l3-4 3 4M12 17v4"/>
          </svg>
          <div class="adafruit-info">
            <span class="adafruit-label">Graphiques</span>
            <span class="adafruit-sub">Adafruit IO</span>
          </div>
        </a>
      </div>
    </div>

    <!-- Cadre principal -->
    <div class="app-frame">

      <!-- Capteurs -->
      <div class="cards-row">

        <div class="card">
          <span class="card-label">🌡️ Température Air</span>
          <span id="temp" class="card-value">--</span><span class="card-unit">°C</span>
        </div>

        <div class="card">
          <span class="card-label">💦 Humidité Air</span>
          <span id="hum" class="card-value">--</span><span class="card-unit">%</span>
        </div>

        <div class="card card-water">
          <span class="card-label">🌊 Température Eau</span>
          <span id="tempWater" class="card-value">--</span><span class="card-unit">°C</span>
        </div>

      </div>

    </div><!-- /app-frame -->
  </div><!-- /app-wrapper -->

  <script src="/script.js"></script>
</body>

</html>
